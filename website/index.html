<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/remedix-logo.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Primary SEO Meta Tags -->
    <title>Remedi-X Solutions | Websites • Chatbots • Automations</title>
    <meta name="description" content="Remedi-X Solutions — Turn missed opportunities into customers with professional websites, AI chatbots, and business automations. Get 3x more leads and 24/7 follow-up." />
    <meta name="keywords" content="web design, AI chatbots, business automation, lead generation, websites, digital marketing, Remedi-X Solutions" />
    <meta name="author" content="Remedi-X Solutions" />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://remedi-x.com/" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://remedi-x.com/" />
    <meta property="og:title" content="Remedi-X Solutions | Websites • Chatbots • Automations" />
    <meta property="og:description" content="Turn missed opportunities into customers with professional websites, AI chatbots, and business automations." />
    <meta property="og:site_name" content="Remedi-X Solutions" />
    <meta property="og:locale" content="en_US" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Remedi-X Solutions | Websites • Chatbots • Automations" />
    <meta name="twitter:description" content="Turn missed opportunities into customers with professional websites, AI chatbots, and business automations." />

    <!-- Theme Color -->
    <meta name="theme-color" content="#9147ff" />

    <!-- Structured Data (JSON-LD) -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "Remedi-X Solutions",
        "url": "https://remedi-x.com",
        "description": "Professional websites, AI chatbots, and business automations to turn missed opportunities into customers.",
        "foundingDate": "2024",
        "sameAs": [],
        "contactPoint": {
          "@type": "ContactPoint",
          "contactType": "sales",
          "availableLanguage": ["English"]
        },
        "offers": {
          "@type": "AggregateOffer",
          "offerCount": "3",
          "itemOffered": [
            {
              "@type": "Service",
              "name": "Website Creation",
              "description": "Professional, conversion-optimized websites"
            },
            {
              "@type": "Service",
              "name": "AI Chatbots",
              "description": "24/7 intelligent chatbots for lead capture and customer support"
            },
            {
              "@type": "Service",
              "name": "Business Automations",
              "description": "Workflow automations to reduce manual work by 80%"
            }
          ]
        }
      }
    </script>

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- Skeleton Styles (inline for instant render) -->
    <style>
      .skeleton-shell {
        min-height: 100vh;
        background: #ffffff;
        font-family: 'Inter', system-ui, sans-serif;
        overflow: hidden;
      }

      /* --- Shimmer Animation --- */
      @keyframes skeleton-shimmer {
        0% { background-position: -400px 0; }
        100% { background-position: 400px 0; }
      }
      .shimmer {
        background: linear-gradient(90deg, #f1f5f9 25%, #e2e8f0 37%, #f1f5f9 63%);
        background-size: 800px 100%;
        animation: skeleton-shimmer 1.8s ease-in-out infinite;
        border-radius: 8px;
      }

      /* --- Skeleton Navbar --- */
      .skel-nav {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        z-index: 50;
        padding: 20px 24px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        max-width: 1280px;
        margin: 0 auto;
      }
      .skel-logo {
        width: 40px;
        height: 40px;
        border-radius: 10px;
      }
      .skel-nav-links {
        display: flex;
        gap: 32px;
        align-items: center;
      }
      .skel-nav-link {
        width: 60px;
        height: 14px;
        border-radius: 7px;
      }
      .skel-nav-btn {
        width: 110px;
        height: 40px;
        border-radius: 20px;
        background: linear-gradient(90deg, rgba(145,71,255,0.08) 25%, rgba(145,71,255,0.15) 37%, rgba(145,71,255,0.08) 63%);
        background-size: 800px 100%;
        animation: skeleton-shimmer 1.8s ease-in-out infinite;
      }

      /* --- Skeleton Hero --- */
      .skel-hero {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 96px 24px 64px;
        text-align: center;
        position: relative;
      }
      .skel-hero::before {
        content: '';
        position: absolute;
        top: 25%;
        left: 50%;
        transform: translateX(-50%);
        width: 500px;
        height: 500px;
        background: radial-gradient(circle, rgba(145,71,255,0.06) 0%, transparent 70%);
        border-radius: 50%;
        pointer-events: none;
      }
      .skel-badge {
        width: 300px;
        height: 32px;
        border-radius: 16px;
        margin-bottom: 32px;
      }
      .skel-heading-1 {
        width: 340px;
        height: 52px;
        margin-bottom: 10px;
      }
      .skel-heading-2 {
        width: 420px;
        height: 52px;
        margin-bottom: 10px;
      }
      .skel-heading-3 {
        width: 280px;
        height: 52px;
        margin-bottom: 32px;
        background: linear-gradient(90deg, rgba(145,71,255,0.12) 25%, rgba(145,71,255,0.22) 37%, rgba(145,71,255,0.12) 63%);
        background-size: 800px 100%;
        animation: skeleton-shimmer 1.8s ease-in-out infinite;
        border-radius: 8px;
      }
      .skel-subtitle {
        width: 520px;
        max-width: 90%;
        height: 18px;
        margin-bottom: 10px;
      }
      .skel-subtitle-2 {
        width: 440px;
        max-width: 80%;
        height: 18px;
        margin-bottom: 48px;
      }
      .skel-cta-row {
        display: flex;
        gap: 16px;
        justify-content: center;
        flex-wrap: wrap;
        margin-bottom: 80px;
      }
      .skel-cta-primary {
        width: 240px;
        height: 52px;
        border-radius: 26px;
        background: linear-gradient(90deg, rgba(145,71,255,0.15) 25%, rgba(145,71,255,0.28) 37%, rgba(145,71,255,0.15) 63%);
        background-size: 800px 100%;
        animation: skeleton-shimmer 1.8s ease-in-out infinite;
      }
      .skel-cta-secondary {
        width: 180px;
        height: 52px;
        border-radius: 26px;
      }
      .skel-stats {
        display: flex;
        gap: 24px;
        justify-content: center;
        flex-wrap: wrap;
        max-width: 768px;
      }
      .skel-stat-card {
        flex: 1;
        min-width: 180px;
        max-width: 240px;
        height: 96px;
        border-radius: 16px;
        border: 1px solid rgba(145,71,255,0.08);
        background: rgba(248,250,252,0.6);
      }

      /* Hide nav links on mobile */
      @media (max-width: 768px) {
        .skel-nav-links { display: none; }
        .skel-heading-1 { width: 240px; height: 40px; }
        .skel-heading-2 { width: 300px; height: 40px; }
        .skel-heading-3 { width: 200px; height: 40px; }
        .skel-stat-card { min-width: 100%; }
      }

      /* --- Noscript Styles --- */
      .noscript-overlay {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        align-items: center;
        justify-content: center;
        background: rgba(15, 23, 42, 0.6);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        padding: 24px;
      }
      .noscript-card {
        background: #ffffff;
        border: 1px solid rgba(145, 71, 255, 0.2);
        border-radius: 20px;
        padding: 48px 40px;
        max-width: 480px;
        text-align: center;
        box-shadow: 0 25px 60px rgba(0, 0, 0, 0.12);
      }
      .noscript-icon {
        width: 56px;
        height: 56px;
        margin: 0 auto 20px;
        background: rgba(145, 71, 255, 0.1);
        border-radius: 16px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 28px;
      }
      .noscript-title {
        font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
        font-size: 22px;
        font-weight: 700;
        color: #0f172a;
        margin: 0 0 12px;
      }
      .noscript-text {
        font-family: 'Inter', system-ui, sans-serif;
        font-size: 15px;
        color: #475569;
        line-height: 1.7;
        margin: 0;
      }
    </style>
  </head>
  <body>
    <div id="root">
      <!-- Skeleton Shell — replaced automatically when React renders -->
      <div class="skeleton-shell" aria-hidden="true">
        <!-- Skeleton Navbar -->
        <header class="skel-nav">
          <div class="skel-logo shimmer"></div>
          <div class="skel-nav-links">
            <div class="skel-nav-link shimmer"></div>
            <div class="skel-nav-link shimmer"></div>
            <div class="skel-nav-link shimmer"></div>
            <div class="skel-nav-link shimmer"></div>
            <div class="skel-nav-btn"></div>
          </div>
        </header>

        <!-- Skeleton Hero -->
        <section class="skel-hero">
          <div class="skel-badge shimmer"></div>
          <div class="skel-heading-1 shimmer"></div>
          <div class="skel-heading-2 shimmer"></div>
          <div class="skel-heading-3"></div>
          <div class="skel-subtitle shimmer"></div>
          <div class="skel-subtitle-2 shimmer"></div>
          <div class="skel-cta-row">
            <div class="skel-cta-primary"></div>
            <div class="skel-cta-secondary shimmer"></div>
          </div>
          <div class="skel-stats">
            <div class="skel-stat-card shimmer"></div>
            <div class="skel-stat-card shimmer"></div>
            <div class="skel-stat-card shimmer"></div>
          </div>
        </section>
      </div>
    </div>

    <!-- Noscript Fallback -->
    <noscript>
      <div class="noscript-overlay">
        <div class="noscript-card">
          <div class="noscript-icon">⚡</div>
          <h2 class="noscript-title">JavaScript Required</h2>
          <p class="noscript-text">
            Remedi-X Solutions needs JavaScript to deliver the best experience.
            Please enable JavaScript in your browser settings and reload the page.
          </p>
        </div>
      </div>
    </noscript>

    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
